name: check-sources

# Upstream lists die silently: domains get bought, projects get retired, hosts
# files go stale. This runs daily and files one tracking issue listing whatever
# stopped working, so it is visible instead of quietly shrinking the blocklist.
on:
  schedule:
    - cron: "11 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check every source
        id: check
        run: |
          python3 scripts/check_sources.py --json > check.json || true
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open("check.json"))
          dead = d["dead"]
          print(f"dead={len(dead)}")
          print(f"list={'|'.join(dead)}")
          PY

      - name: Summary
        run: |
          {
            echo "### source check"
            echo
            python3 -c "
          import json
          d = json.load(open('check.json'))
          dead = {s['id'] for s in d['sources'] if s['status'] != 'alive'}
          for s in d['sources']:
              mark = 'FAIL' if s['id'] in dead else 'ok'
              size = f\"{s.get('bytes', 0)/1e6:.1f} MB\" if s.get('bytes') else '-'
              print(f\"| {mark} | \`{s['id']}\` | {size} | {'yes' if s['changed'] else ''} |\")
          "
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the dead-sources issue
        if: steps.check.outputs.dead != '0'
        run: |
          BODY=$(python3 -c "
          import json
          d = json.load(open('check.json'))
          ids = set(d['dead'])
          print('| Source | Error |')
          print('| --- | --- |')
          for s in d['sources']:
              if s['id'] in ids:
                  print(f\"| \\\`{s['id']}\\\` | {s.get('error', 'empty response')} |\")
          print()
          print('Fix: set \`enabled = false\` with a \`caution\` reason in \`sources.toml\`, or update the URL.')
          ")
          # shellcheck disable=SC2016
          gh issue list --repo "$GITHUB_REPOSITORY" \
            --label sources --state open --json number --jq '.[0].number' > issue.txt
          if [ -s issue.txt ] && [ "$(cat issue.txt)" != "null" ]; then
            gh issue edit "$(cat issue.txt)" --body "$BODY"
          else
            printf '<!-- source-check -->\n%s\n' "$BODY" | gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "One or more upstream blocklists are unreachable" \
              --label sources --body-file -
          fi

      - name: Fail if anything enabled is dead
        if: steps.check.outputs.dead != '0'
        run: |
          echo "::error::unreachable sources: ${{ steps.check.outputs.list }}"
          exit 1
