name: check-sources

# Upstream lists die silently: domains get bought, projects get retired, hosts
# files go stale. This runs daily and files one tracking issue listing whatever
# stopped working, so a dead list is visible instead of quietly shrinking the
# blocklist.
on:
  schedule:
    - cron: "11 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check every source
        id: probe
        run: |
          python3 scripts/check_sources.py --json > check.json || true
          echo "dead=$(jq '.dead | length' check.json)" >> "$GITHUB_OUTPUT"
          echo "list=$(jq -r '.dead | join(" ")' check.json)" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### source check"
            echo
            echo "| | Source | Size | Changed |"
            echo "| --- | --- | ---: | --- |"
            jq -r '.sources[]
              | (if .status == "alive" then "ok" else "**FAIL**" end) as $s
              | "| \($s) | `\(.id)` | \(if .bytes then ((.bytes/1000000*10|round)/10|tostring) + " MB" else "-" end) | \(if .changed then "yes" else "" end) |"'
              check.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the dead-sources issue
        if: steps.probe.outputs.dead != '0'
        env:
          DEAD: ${{ steps.probe.outputs.list }}
        run: |
          {
            echo "<!-- source-check -->"
            echo "Upstream blocklists that stopped responding. Generated by \`check-sources\`."
            echo
            echo "| Source | Error |"
            echo "| --- | --- |"
            jq -r --argjson dead "$(echo "$DEAD" | jq -R 'split(" ")' | jq '[.[]] | map(select(length > 0))')" \
              '.sources[] | select(.id as $i | $dead | index($i))
               | "| `\(.id)` | \(.error // "empty response") |"' check.json
            echo
            echo "Fix: set \`enabled = false\` with a \`caution\` reason in \`sources.toml\`, or update the URL."
          } > body.md
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label sources --state open \
                   --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "One or more upstream blocklists are unreachable" \
              --label sources --body-file body.md
          fi

      - name: Fail if anything enabled is dead
        if: steps.probe.outputs.dead != '0'
        run: |
          echo "::error::unreachable sources: ${{ steps.probe.outputs.list }}"
          exit 1
