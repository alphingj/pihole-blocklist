## Source manifest for pihole-blocklist
##
## Every upstream blocklist that feeds the generated lists. Edit this file to
## add, remove, re-categorise or disable a source -- no code changes needed.
##
## Fields
##   id          short slug, used for filenames and stats
##   url         raw blocklist URL (must return plain text, not HTML)
##   categories  one or more of: ads tracking malware phishing scam crypto
##               spam spyware adult gambling
##   enabled     false keeps the source documented but out of every list
##   multipurpose  true = the list spans several of its declared categories
##   license     optional override; otherwise auto-detected from the list header
##   caution     required when enabled = false, explains why
##   note        optional free text shown in SOURCES.md
##
## Verified 2026-10-03 against each list's own header, not filenames.

[groups]
core      = ["ads", "malware", "phishing"]
junk      = ["tracking", "scam", "crypto", "spam"]
sensitive = ["spyware", "gambling", "adult"]

[lists]
## Emitted as release assets. "everything" is the plain union of all groups.
allinone   = { exclude_categories = ["adult", "gambling"], scrub_adult = true }
adult      = { include_categories = ["adult", "gambling"] }
core       = { groups = ["core"], scrub_adult = true }
junk       = { groups = ["junk"], scrub_adult = true }
sensitive  = { groups = ["sensitive"] }
everything = { all_groups = true }

## Applied to every list with scrub_adult = true. Net 1 (exact) is dropping any
## domain that also appears in adult.txt; these keywords are net 2 (heuristic).
[adult_scrub]
keywords = [
  "porn", "porno", "xxx", "nsfw", "hentai", "escort", "camgirl", "cam-soda",
  "camsoda", "sextube", "onlyfans", "stripchat", "bongacams", "chaturbate",
  "camwhores", "tube8", "redtube", "youporn", "motherless", "spankbang",
  "keezmovies", "bukkake", "shemale", "creampie", "voyeur", "erotic", "fetish",
]

## Rejected outright by the parser, from every list, before anything else.
[parser]
blocked_names = [
  "localhost", "local", "localhost.localdomain", "ip6-localhost", "ip6-loopback",
  "ip6-allnodes", "ip6-allrouters", "ip6-allhosts", "ip6-localnet",
  "ip6-mcastprefix", "broadcasthost", "home", "lan", "intranet", "corp",
]
blocked_suffixes = [".local", ".localhost", ".arpa", ".test", ".invalid", ".example", ".internal", ".home"]
max_labels = 8
max_hyphen_run = 2

